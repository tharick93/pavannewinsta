<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - StacklyHub</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="error-container">
    <div class="error-card">

      <div class="logo">
        <i class="fas fa-layer-group"></i>
        <span>StacklyHub</span>
      </div>

      <h1>404</h1>

      <h2>Oops! Page Not Found</h2>

      <p>
        The page you're looking for doesn't exist, was moved,
        or is currently unavailable.
      </p>

      <div class="buttons">
        <button onclick="history.back()" class="btn secondary">
          <i class="fas fa-arrow-left"></i>
          Go Back
        </button>

        <a href="index.html" class="btn primary">
          <i class="fas fa-home"></i>
          Back to Home
        </a>
      </div>

    </div>
  </div>
  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:#fff;
    overflow:hidden;
}

.error-container{
    width:100%;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.error-card{
    max-width:600px;
    width:100%;
    text-align:center;
    padding:50px 35px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:20px;
}

.logo i{
    color:#8b5cf6;
}

.error-card h1{
    font-size:8rem;
    line-height:1;
    font-weight:800;
    background:linear-gradient(45deg,#8b5cf6,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.error-card h2{
    margin-top:15px;
    font-size:2rem;
}

.error-card p{
    margin-top:15px;
    color:#cbd5e1;
    line-height:1.7;
}

.buttons{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 24px;
    border-radius:50px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-size:1rem;
    font-weight:600;
    transition:0.3s ease;
    display:flex;
    align-items:center;
    gap:8px;
}

.primary{
    background:linear-gradient(45deg,#8b5cf6,#ec4899);
    color:#fff;
}

.primary:hover{
    transform:translateY(-3px);
}

.secondary{
    background:rgba(255,255,255,0.1);
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
}

.secondary:hover{
    background:rgba(255,255,255,0.18);
}

@media(max-width:768px){

    .error-card{
        padding:40px 25px;
    }

    .error-card h1{
        font-size:6rem;
    }

    .error-card h2{
        font-size:1.6rem;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
        justify-content:center;
    }
}

@media(max-width:480px){

    .error-card h1{
        font-size:4.5rem;
    }

    .error-card h2{
        font-size:1.3rem;
    }

    .error-card p{
        font-size:0.95rem;
    }
}
  </style>

</body>
</html>
